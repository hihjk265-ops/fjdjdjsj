          package com.iphonekb

          import android.content.Context

          /**
           * Словарь подсказок: встроенные списки (EN/RU по частоте) + слова, которые
           * пользователь вводит сам. Всё хранится только на телефоне.
           */
          class Dictionary private constructor(ctx: Context) {

              private val en: List<String> = load(ctx, R.raw.words_en)
              private val ru: List<String> = load(ctx, R.raw.words_ru)
              private val sp = ctx.applicationContext.getSharedPreferences("words", Context.MODE_PRIVATE)
              private val learned = HashMap<String, Int>()

              init {
                  val data = sp.getString("data", "") ?: ""
                  for (line in data.split("\n")) {
                      val parts = line.split("\t")
                      if (parts.size == 2) {
                          val n = parts[1].toIntOrNull()
                          if (n != null && parts[0].isNotEmpty()) learned[parts[0]] = n
                      }
                  }
              }

              private fun load(ctx: Context, id: Int): List<String> =
                  ctx.resources.openRawResource(id).bufferedReader().use { r ->
                      r.readLines().map { it.trim() }.filter { it.isNotEmpty() }
                  }

              fun learnedCount(): Int = learned.size

              fun clearLearned() {
                  learned.clear()
                  sp.edit().remove("data").apply()
              }

              fun learn(word: String, weight: Int = 1) {
                  val w = word.lowercase().trim('\'')
                  if (w.length < 2 || w.length > 24) return
                  if (!w.all { it.isLetter() || it == '\'' }) return
                  learned[w] = (learned[w] ?: 0) + weight
                  if (learned.size > 3000) {
                      // выкидываем самые редкие слова
                      val keep = learned.entries.sortedByDescending { it.value }.take(2500)
                      learned.clear()
                      for (e in keep) learned[e.key] = e.value
                  }
                  save()
              }

              private fun save() {
                  val sb = StringBuilder()
                  for ((k, v) in learned) sb.append(k).append('\t').append(v).append('\n')
                  sp.edit().putString("data", sb.toString()).apply()
              }

              private fun isCyrillic(c: Char): Boolean =
                  Character.UnicodeScript.of(c.code) == Character.UnicodeScript.CYRILLIC

              fun suggest(prefix: String, max: Int): List<String> {
                  if (prefix.isEmpty()) return emptyList()
                  val p = prefix.lowercase()
                  val cyr = isCyrillic(p[0])
                  val base = if (cyr) ru else en
                  val out = ArrayList<String>()

                  fun ok(w: String) = w.length > p.length && w.startsWith(p) &&
                      isCyrillic(w[0]) == cyr && !out.contains(w)

                  // 1) слова, которые пользователь вводил не раз
                  learned.entries
                      .filter { it.value >= 2 && ok(it.key) }
                      .sortedByDescending { it.value }
                      .forEach { if (out.size < max) out.add(it.key) }
                  // 2) встроенный словарь по частоте
                  for (w in base) {
                      if (out.size >= max) break
                      if (ok(w)) out.add(w)
                  }
                  // 3) слова, встреченные один раз
                  if (out.size < max) {
                      learned.entries
                          .filter { it.value < 2 && ok(it.key) }
                          .sortedBy { it.key.length }
                          .forEach { if (out.size < max) out.add(it.key) }
                  }

                  val cap = prefix[0].isUpperCase()
                  return out.map { w ->
                      if (cap || w.startsWith("i'")) w.replaceFirstChar { c -> c.uppercase() } else w
                  }
              }

              companion object {
                  @Volatile
                  private var inst: Dictionary? = null

                  fun get(c: Context): Dictionary =
                      inst ?: synchronized(this) {
                          inst ?: Dictionary(c.applicationContext).also { inst = it }
                      }

                  /** Слово слева от курсора: хвост из букв и апострофа. */
                  fun prefixOf(text: CharSequence): String {
                      var i = text.length
                      while (i > 0 && (text[i - 1].isLetter() || text[i - 1] == '\'')) i--
                      return text.substring(i)
                  }
              }
          }
