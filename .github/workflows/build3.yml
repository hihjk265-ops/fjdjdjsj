          package com.iphonekb

          import android.content.Context
          import android.media.AudioAttributes
          import android.media.SoundPool
          import kotlin.random.Random

          /** Реальные записи клавиш (res/raw). У каждого набора несколько вариантов буквы, чтобы не звучало одинаково. */
          class SoundEngine private constructor(ctx: Context) {

              class Style(val name: String, val letters: IntArray, val del: Int, val space: Int)

              private val pool: SoundPool = SoundPool.Builder()
                  .setMaxStreams(6)
                  .setAudioAttributes(
                      AudioAttributes.Builder()
                          .setUsage(AudioAttributes.USAGE_ASSISTANCE_SONIFICATION)
                          .setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION)
                          .build()
                  ).build()

              private val loaded = HashMap<Int, Int>() // res id -> sound id
              private var last = -1

              init {
                  for (s in STYLES) {
                      for (r in s.letters) load(ctx, r)
                      load(ctx, s.del)
                      load(ctx, s.space)
                  }
              }

              private fun load(ctx: Context, res: Int) {
                  if (!loaded.containsKey(res)) loaded[res] = pool.load(ctx, res, 1)
              }

              fun prepare() {}

              /** kind: 0 = буква, 1 = удаление, 2 = пробел/служебные */
              fun play(style: Int, kind: Int, vol: Float) {
                  val s = STYLES[style.coerceIn(0, STYLES.size - 1)]
                  val res = when (kind) {
                      0 -> {
                          var i = Random.nextInt(s.letters.size)
                          if (i == last) i = (i + 1) % s.letters.size
                          last = i
                          s.letters[i]
                      }
                      1 -> s.del
                      else -> s.space
                  }
                  val id = loaded[res] ?: return
                  val rate = 0.97f + Random.nextFloat() * 0.06f
                  pool.play(id, vol, vol, 1, 0, rate)
              }

              companion object {
                  val STYLES = listOf(
                      Style(
                          "iPhone: тик",
                          intArrayOf(R.raw.tick_l0, R.raw.tick_l1, R.raw.tick_l2),
                          R.raw.tick_del, R.raw.tick_sp
                      ),
                      Style(
                          "iPhone: клик",
                          intArrayOf(R.raw.clk_l0, R.raw.clk_l1, R.raw.clk_l2),
                          R.raw.clk_del, R.raw.clk_sp
                      )
                  )

                  @Volatile
                  private var inst: SoundEngine? = null

                  fun get(c: Context): SoundEngine =
                      inst ?: synchronized(this) {
