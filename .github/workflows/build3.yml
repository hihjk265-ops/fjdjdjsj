          class SettingsActivity : Activity() {

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val p = Prefs(this)
                  val dict = Dictionary.get(this)
                  val d = resources.displayMetrics.density
                  fun dp(x: Int) = (x * d).toInt()

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(16), dp(24), dp(16), dp(24))
                  }

                  fun label(t: String, size: Float = 16f, bold: Boolean = false) = TextView(this).apply {
                      text = t
                      textSize = size
                      if (bold) setTypeface(null, Typeface.BOLD)
                      setPadding(0, dp(14), 0, dp(6))
                  }

                  fun button(t: String, f: () -> Unit) = Button(this).apply {
                      text = t
                      isAllCaps = false
                      setOnClickListener { f() }
                  }

                  val kv = KeyboardView(this)
                  val edit = EditText(this).apply {
                      hint = "Проверь клавиатуру здесь"
                      showSoftInputOnFocus = false
                  }

                  fun cursor(): Int = edit.selectionStart.coerceAtLeast(0)

                  fun refreshPreview() {
                      if (!p.suggest) {
                          kv.suggestions = emptyList()
                          return
                      }
                      val pre = Dictionary.prefixOf(edit.text.subSequence(0, cursor()))
                      kv.suggestions = if (pre.isEmpty()) emptyList() else dict.suggest(pre, 3)
                  }

                  kv.listener = object : KeyboardView.Listener {
                      override fun onText(t: String) {
                          edit.text.insert(cursor(), t)
                          refreshPreview()
                      }

                      override fun onDelete() {
                          val s = edit.selectionStart
                          if (s > 0) edit.text.delete(s - 1, s)
                          refreshPreview()
                      }

                      override fun onEnter() {
                          edit.text.insert(cursor(), "\n")
                          refreshPreview()
                      }

                      override fun onSwitchIme() {
                          (getSystemService(INPUT_METHOD_SERVICE) as InputMethodManager).showInputMethodPicker()
                      }

                      override fun onSuggest(w: String) {
                          val pos = cursor()
                          val pre = Dictionary.prefixOf(edit.text.subSequence(0, pos))
                          val ins = if (p.autoSpace) "$w " else w
                          edit.text.replace(pos - pre.length, pos, ins)
                          edit.setSelection(pos - pre.length + ins.length)
                          refreshPreview()
                      }
                  }

                  root.addView(label("iPhone Keyboard", 26f, true))
                  root.addView(label("Включи клавиатуру, выбери её и пользуйся."))
                  root.addView(button("1. Включить клавиатуру в настройках") {
                      startActivity(Intent(Settings.ACTION_INPUT_METHOD_SETTINGS))
                  })
                  root.addView(button("2. Выбрать клавиатуру") {
                      (getSystemService(INPUT_METHOD_SERVICE) as InputMethodManager).showInputMethodPicker()
                  })

                  // Темы
                  root.addView(label("Тема", 18f, true))
                  val themeButtons = ArrayList<Button>()
                  fun refreshThemes() {
                      themeButtons.forEachIndexed { i, b ->
                          b.text = (if (i == p.theme) "✓  " else "") + Themes.all[i].name
                      }
                  }
                  Themes.all.forEachIndexed { i, t ->
                      val b = button(t.name) {
                          p.theme = i
                          kv.theme = t
                          refreshThemes()
                      }
                      b.setBackgroundColor(t.bg)
                      b.setTextColor(t.text)
                      themeButtons.add(b)
                      root.addView(b)
                  }
                  refreshThemes()

                  // Звук
                  root.addView(label("Звук", 18f, true))
                  root.addView(CheckBox(this).apply {
                      text = "Звук нажатий"
                      isChecked = p.soundOn
                      setOnCheckedChangeListener { _, v -> p.soundOn = v }
                  })
                  val rg = RadioGroup(this)
                  SoundEngine.STYLES.forEachIndexed { i, s ->
                      rg.addView(RadioButton(this).apply {
                          text = s.name
                          id = 1000 + i
                          isChecked = i == p.soundStyle
                      })
                  }
                  rg.setOnCheckedChangeListener { _, id ->
                      p.soundStyle = id - 1000
                      SoundEngine.get(this).play(p.soundStyle, 0, p.volume / 100f)
                  }
                  root.addView(rg)
                  root.addView(label("Громкость"))
                  root.addView(SeekBar(this).apply {
                      max = 100
                      progress = p.volume
                      setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                          override fun onProgressChanged(s: SeekBar, v: Int, fromUser: Boolean) {
                              p.volume = v
                          }

                          override fun onStartTrackingTouch(s: SeekBar) {}
                          override fun onStopTrackingTouch(s: SeekBar) {
                              SoundEngine.get(this@SettingsActivity).play(p.soundStyle, 0, p.volume / 100f)
                          }
                      })
                  })

                  // Подсказки слов
                  root.addView(label("Подсказки слов", 18f, true))
                  root.addView(CheckBox(this).apply {
                      text = "Показывать подсказки над клавишами"
                      isChecked = p.suggest
                      setOnCheckedChangeListener { _, v ->
                          p.suggest = v
                          refreshPreview()
                      }
                  })
                  root.addView(CheckBox(this).apply {
                      text = "Запоминать слова, которые я пишу"
                      isChecked = p.learn
                      setOnCheckedChangeListener { _, v -> p.learn = v }
                  })
                  root.addView(CheckBox(this).apply {
                      text = "Ставить пробел после выбора подсказки"
                      isChecked = p.autoSpace
                      setOnCheckedChangeListener { _, v -> p.autoSpace = v }
                  })
                  val learnedLabel = label("")
                  fun updateLearned() {
                      learnedLabel.text = "Выучено слов: " + dict.learnedCount()
                  }
                  updateLearned()
                  root.addView(learnedLabel)
                  root.addView(button("Очистить выученные слова") {
                      dict.clearLearned()
                      updateLearned()
                      refreshPreview()
                  })
                  root.addView(label("В полях для паролей, почты, ссылок и чисел подсказки и запоминание отключены.", 13f))

                  // Прочее
                  root.addView(label("Прочее", 18f, true))
                  root.addView(CheckBox(this).apply {
                      text = "Вибрация"
                      isChecked = p.haptic
                      setOnCheckedChangeListener { _, v -> p.haptic = v }
                  })
                  root.addView(CheckBox(this).apply {
                      text = "Увеличенная буква при нажатии"
                      isChecked = p.popup
                      setOnCheckedChangeListener { _, v -> p.popup = v }
                  })

                  // Предпросмотр
                  root.addView(label("Проверка", 18f, true))
                  root.addView(edit)
                  root.addView(
                      kv,
                      LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT)
                  )

                  setContentView(ScrollView(this).apply { addView(root) })
              }
          }
