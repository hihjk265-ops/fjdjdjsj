          package com.iphonekb

          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.graphics.Path
          import android.graphics.RectF
          import android.os.Handler
          import android.os.Looper
          import android.os.SystemClock
          import android.text.TextPaint
          import android.text.TextUtils
          import android.util.TypedValue
          import android.view.HapticFeedbackConstants
          import android.view.MotionEvent
          import android.view.VelocityTracker
          import android.view.View
          import android.view.ViewConfiguration
          import android.widget.OverScroller
          import kotlin.math.abs

          class KeyboardView(ctx: Context) : View(ctx) {

              interface Listener {
                  fun onText(t: String)
                  fun onDelete()
                  fun onEnter()
                  fun onSwitchIme()
                  fun onSuggest(w: String) {}
              }

              enum class T { CHAR, SHIFT, DEL, MODE, SYM, SPACE, ENTER, LANG, EMOJI, GAP }

              class Key(val label: String, val type: T, val w: Float = 1f) {
                  val r = RectF()
              }

              var listener: Listener? = null
              private val prefs = Prefs(ctx)
              private val sound = SoundEngine.get(ctx)

              private val d = resources.displayMetrics.density
              private val keyH = 52 * d
              private val vGap = 11 * d
              private val hGap = 6 * d
              private val side = 3 * d
              private val topPad = 52 * d
              private val bottomPad = 10 * d
              private val radius = 6 * d
              private val barTop = 4 * d
              private val barBottom = topPad - 4 * d
              private val gridTop = topPad
              private val gridBottom = topPad + 3 * keyH + 2.5f * vGap
              private val emojiCols = 8
              private val slop = ViewConfiguration.get(ctx).scaledTouchSlop

              var theme: Theme = Themes.all[prefs.theme]
                  set(v) { field = v; invalidate() }
              var enterLabel: String = "return"
                  set(v) { field = v; invalidate() }
              var page = 0
                  set(v) { field = v; build() }
              var lang = prefs.lang
              var shift = 0
              var suggestions: List<String> = emptyList()
                  set(v) { field = v; invalidate() }

              private var rows: List<List<Key>> = emptyList()
              private val active = HashMap<Int, Key>()
              private val handler = Handler(Looper.getMainLooper())
              private var langLong = false
              private var lastShiftTap = 0L

              // подсказки
              private var barSlot = -1

              // смайлики
              private var emojiCat = 1
              private var emojiScroll = 0f
              private val recent: MutableList<String> =
                  prefs.recentEmoji.split(" ").filter { it.isNotEmpty() }.toMutableList()
              private var recentShown: List<String> = emptyList()
              private val scroller = OverScroller(ctx)
              private var velocity: VelocityTracker? = null
              private var gesture = G_KEYS
              private var downX = 0f
              private var downY = 0f
              private var downScroll = 0f
              private var dragging = false
              private var tabDown = -1

              private val fill = Paint(Paint.ANTI_ALIAS_FLAG)
              private val tp = TextPaint(Paint.ANTI_ALIAS_FLAG).apply { textAlign = Paint.Align.CENTER }
              private val ip = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  strokeWidth = 2 * d
                  strokeCap = Paint.Cap.ROUND
                  strokeJoin = Paint.Join.ROUND
              }

              private val repeat = object : Runnable {
                  override fun run() {
                      listener?.onDelete()
                      handler.postDelayed(this, 55)
                  }
              }
              private val langRun = Runnable {
                  langLong = true
                  listener?.onSwitchIme()
              }
              // долгое нажатие: е -> ё
              private var altKey: Key? = null
              private var altOn = false
              private val altRun = Runnable {
                  if (altKey != null) {
                      altOn = true
                      haptic()
                      invalidate()
                  }
              }
              private val flingRun = object : Runnable {
                  override fun run() {
                      if (scroller.computeScrollOffset()) {
                          emojiScroll = scroller.currY.toFloat().coerceIn(0f, maxScroll())
                          invalidate()
                          postOnAnimation(this)
                      }
                  }
              }

              init {
                  build()
              }

              override fun onDetachedFromWindow() {
                  super.onDetachedFromWindow()
                  handler.removeCallbacksAndMessages(null)
                  removeCallbacks(flingRun)
              }

              // ---------- публичное ----------

              fun refresh() {
                  theme = Themes.all[prefs.theme]
                  lang = prefs.lang
                  build()
              }

              fun configure(inputType: Int) {
                  val cls = inputType and android.text.InputType.TYPE_MASK_CLASS
                  page = if (cls == android.text.InputType.TYPE_CLASS_NUMBER ||
                      cls == android.text.InputType.TYPE_CLASS_PHONE) 1 else 0
              }

              fun autoShift(on: Boolean) {
                  if (shift != 2) {
                      shift = if (on) 1 else 0
                      invalidate()
                  }
              }

              // ---------- раскладка ----------

              private fun chars(s: String, w: Float = 1f) = s.map { Key(it.toString(), T.CHAR, w) }

              private fun build() {
                  val out = ArrayList<List<Key>>()
                  when (page) {
                      0 -> {
                          val r = if (lang == 0) listOf("qwertyuiop", "asdfghjkl", "zxcvbnm")
                          else listOf("йцукенгшщзхъ", "фывапролджэ", "ячсмитьбю")
                          out.add(chars(r[0]))
                          if (lang == 0) out.add(listOf(Key("", T.GAP, 0.5f)) + chars(r[1]) + Key("", T.GAP, 0.5f))
                          else out.add(chars(r[1]))
                          out.add(listOf(Key("", T.SHIFT, 1.5f)) + chars(r[2]) + Key("", T.DEL, 1.5f))
                      }
                      1 -> {
                          out.add(chars("1234567890"))
                          out.add(chars("-/:;()₴&@\""))
                          out.add(listOf(Key("#+=", T.SYM, 1.5f)) + chars(".,?!'", 1.4f) + Key("", T.DEL, 1.5f))
                      }
                      2 -> {
                          out.add(chars("[]{}#%^*+="))
                          out.add(chars("_\\|~<>€£¥•"))
                          out.add(listOf(Key("123", T.SYM, 1.5f)) + chars(".,?!'", 1.4f) + Key("", T.DEL, 1.5f))
                      }
                      else -> {
                          out.add(emptyList())
                          out.add(emptyList())
                          out.add(emptyList())
                      }
                  }
                  if (page == 3) {
                      out.add(
                          listOf(
                              Key("ABC", T.MODE, 1.6f),
                              Key("", T.SPACE, 6f),
                              Key("", T.DEL, 1.6f)
                          )
                      )
                  } else {
                      out.add(
                          listOf(
                              Key(if (page == 0) "123" else "ABC", T.MODE, 1.3f),
                              Key("", T.EMOJI, 1.1f),
                              Key("", T.LANG, 1.1f),
                              Key("", T.SPACE, 3.6f),
                              Key("", T.ENTER, 2f)
                          )
                      )
                  }
                  rows = out
                  layoutKeys()
                  invalidate()
              }

              private fun layoutKeys() {
                  if (width == 0) return
                  var y = topPad
                  for (row in rows) {
                      if (row.isNotEmpty()) {
                          var total = 0f
                          for (k in row) total += k.w
                          val avail = width - 2 * side - hGap * (row.size - 1)
                          val unit = avail / total
                          var x = side
                          for (k in row) {
                              val kw = k.w * unit
                              k.r.set(x, y, x + kw, y + keyH)
                              x += kw + hGap
                          }
                      }
                      y += keyH + vGap
                  }
              }

              override fun onSizeChanged(w: Int, h: Int, ow: Int, oh: Int) {
                  super.onSizeChanged(w, h, ow, oh)
                  layoutKeys()
              }

              override fun onMeasure(wSpec: Int, hSpec: Int) {
                  val h = (topPad + 4 * keyH + 3 * vGap + bottomPad).toInt()
                  setMeasuredDimension(MeasureSpec.getSize(wSpec), h)
              }

              // ---------- рисование ----------

              private fun sp(x: Float) =
                  TypedValue.applyDimension(TypedValue.COMPLEX_UNIT_SP, x, resources.displayMetrics)

              private fun text(c: Canvas, s: String, cx: Float, cy: Float, size: Float, color: Int) {
                  tp.textSize = size
                  tp.color = color
                  val fm = tp.fontMetrics
                  c.drawText(s, cx, cy - (fm.ascent + fm.descent) / 2, tp)
              }

              override fun onDraw(c: Canvas) {
                  c.drawColor(theme.bg)
                  if (page == 3) drawEmoji(c) else drawBar(c)
                  val pressed = active.values.toSet()
                  for (row in rows) for (k in row) {
                      if (k.type == T.GAP) continue
                      drawKey(c, k, k in pressed)
                  }
                  if (page != 3 && prefs.popup) for (k in pressed) if (k.type == T.CHAR) drawBubble(c, k)
              }

              private fun drawBar(c: Canvas) {
                  if (!prefs.suggest) return
                  val sw = width / 3f
                  for (i in 0 until 3) {
                      val s = suggestions.getOrNull(i) ?: continue
                      val left = i * sw
                      if (i == barSlot) {
                          fill.color = theme.special
                          c.drawRoundRect(left + 3 * d, barTop, left + sw - 3 * d, barBottom, radius, radius, fill)
                      }
                      tp.textSize = sp(18f)
                      tp.isFakeBoldText = false
                      val t = TextUtils.ellipsize(s, tp, sw - 16 * d, TextUtils.TruncateAt.END).toString()
                      text(c, t, left + sw / 2, (barTop + barBottom) / 2, sp(18f), theme.text)
                      if (i < 2 && suggestions.size > i + 1) {
                          fill.color = theme.special
                          c.drawRect(left + sw - 0.5f * d, barTop + 7 * d, left + sw + 0.5f * d, barBottom - 7 * d, fill)
                      }
                  }
              }

              private fun drawEmoji(c: Canvas) {
                  val n = Emojis.cats.size + 1
                  val tw = width / n.toFloat()
                  for (i in 0 until n) {
                      if (i == emojiCat) {
                          fill.color = theme.special
                          c.drawRoundRect(i * tw + 2 * d, barTop, (i + 1) * tw - 2 * d, barBottom, radius, radius, fill)
                      }
                      text(c, tabIcon(i), i * tw + tw / 2, (barTop + barBottom) / 2, sp(20f), theme.text)
                  }

                  val list = catList(emojiCat)
                  if (list.isEmpty()) {
                      text(c, "Здесь появятся недавние смайлики", width / 2f, (gridTop + gridBottom) / 2, sp(14f), theme.text)
                      return
                  }
                  val cw = width / emojiCols.toFloat()
                  val rowsN = (list.size + emojiCols - 1) / emojiCols
                  emojiScroll = emojiScroll.coerceIn(0f, maxScroll())
                  c.save()
                  c.clipRect(0f, gridTop, width.toFloat(), gridBottom)
                  val firstRow = maxOf(0, (emojiScroll / cw).toInt())
                  val lastRow = minOf(rowsN - 1, ((emojiScroll + gridBottom - gridTop) / cw).toInt())
                  for (row in firstRow..lastRow) {
                      for (col in 0 until emojiCols) {
                          val idx = row * emojiCols + col
                          if (idx >= list.size) break
                          text(
                              c, list[idx], col * cw + cw / 2, gridTop + row * cw - emojiScroll + cw / 2,
                              cw * 0.56f, theme.text
                          )
                      }
                  }
                  c.restore()
              }

              private fun drawKey(c: Canvas, k: Key, pressed: Boolean) {
                  val isLight = k.type == T.CHAR || k.type == T.SPACE
                  val accent = k.type == T.ENTER && enterLabel != "return"
                  var bg = when {
                      accent -> theme.accent
                      isLight -> theme.key
                      else -> theme.special
                  }
                  if (pressed) bg = if (isLight) theme.special else theme.key
                  if (k.type == T.SHIFT && shift > 0 && !pressed) bg = theme.key

                  fill.color = theme.shadow
                  c.drawRoundRect(k.r.left, k.r.top + 1.2f * d, k.r.right, k.r.bottom + 1.2f * d, radius, radius, fill)
                  fill.color = bg
                  c.drawRoundRect(k.r, radius, radius, fill)

                  val tx = if (accent) Color.WHITE else theme.text
                  val cx = k.r.centerX()
                  val cy = k.r.centerY()
                  when (k.type) {
                      T.CHAR -> {
                          val s = if (page == 0 && shift > 0) k.label.uppercase() else k.label
                          text(c, s, cx, cy, sp(25f), tx)
                      }
                      T.SPACE -> text(c, if (lang == 0) "space" else "пробел", cx, cy, sp(15f), tx)
                      T.ENTER -> text(c, enterLabel, cx, cy, sp(15f), tx)
                      T.MODE, T.SYM -> text(c, k.label, cx, cy, sp(15f), tx)
                      T.LANG -> text(c, if (lang == 0) "EN" else "RU", cx, cy, sp(14f), tx)
                      T.SHIFT -> drawShift(c, cx, cy, tx)
                      T.DEL -> drawDelete(c, cx, cy, tx)
                      T.EMOJI -> drawSmiley(c, cx, cy, tx)
                      T.GAP -> {}
                  }
              }

              private fun drawSmiley(c: Canvas, cx: Float, cy: Float, color: Int) {
                  val r = 9 * d
                  ip.color = color
                  ip.style = Paint.Style.STROKE
                  c.drawCircle(cx, cy, r, ip)
                  ip.style = Paint.Style.FILL
                  c.drawCircle(cx - r * 0.38f, cy - r * 0.25f, 1.3f * d, ip)
                  c.drawCircle(cx + r * 0.38f, cy - r * 0.25f, 1.3f * d, ip)
                  ip.style = Paint.Style.STROKE
                  c.drawArc(cx - r * 0.55f, cy - r * 0.4f, cx + r * 0.55f, cy + r * 0.55f, 20f, 140f, false, ip)
              }

              private fun drawShift(c: Canvas, cx: Float, cy: Float, color: Int) {
                  val s = 9 * d
                  val p = Path().apply {
                      moveTo(cx, cy - s)
                      lineTo(cx + s, cy)
                      lineTo(cx + s * 0.45f, cy)
                      lineTo(cx + s * 0.45f, cy + s * 0.8f)
                      lineTo(cx - s * 0.45f, cy + s * 0.8f)
                      lineTo(cx - s * 0.45f, cy)
                      lineTo(cx - s, cy)
                      close()
                  }
                  ip.color = color
                  ip.style = if (shift > 0) Paint.Style.FILL_AND_STROKE else Paint.Style.STROKE
                  c.drawPath(p, ip)
                  if (shift == 2) {
                      ip.style = Paint.Style.FILL
                      c.drawRect(cx - s * 0.45f, cy + s * 1.05f, cx + s * 0.45f, cy + s * 1.05f + 2 * d, ip)
                  }
              }

              private fun drawDelete(c: Canvas, cx: Float, cy: Float, color: Int) {
                  val s = 9 * d
                  val p = Path().apply {
                      moveTo(cx - s * 1.3f, cy)
                      lineTo(cx - s * 0.4f, cy - s * 0.85f)
                      lineTo(cx + s * 1.2f, cy - s * 0.85f)
                      lineTo(cx + s * 1.2f, cy + s * 0.85f)
                      lineTo(cx - s * 0.4f, cy + s * 0.85f)
                      close()
                  }
                  ip.color = color
                  ip.style = Paint.Style.STROKE
                  c.drawPath(p, ip)
                  c.drawLine(cx - s * 0.05f, cy - s * 0.35f, cx + s * 0.75f, cy + s * 0.35f, ip)
                  c.drawLine(cx - s * 0.05f, cy + s * 0.35f, cx + s * 0.75f, cy - s * 0.35f, ip)
              }

              private fun drawBubble(c: Canvas, k: Key) {
                  val bw = k.r.width() * 1.4f
                  val bh = 52 * d
                  var l = k.r.centerX() - bw / 2
                  l = l.coerceIn(2 * d, width - bw - 2 * d)
                  val bottom = k.r.top + 6 * d
                  val rect = RectF(l, bottom - bh, l + bw, bottom)
                  fill.color = theme.shadow
                  c.drawRoundRect(rect.left, rect.top + 1.5f * d, rect.right, rect.bottom + 1.5f * d, radius * 1.6f, radius * 1.6f, fill)
                  fill.color = theme.key
                  c.drawRoundRect(rect, radius * 1.6f, radius * 1.6f, fill)
                  val base = if (altOn && altKey === k) (ALTS[k.label] ?: k.label) else k.label
                  val s = if (page == 0 && shift > 0) base.uppercase() else base
                  text(c, s, rect.centerX(), rect.centerY() - 3 * d, sp(32f), theme.text)
              }

              // ---------- смайлики: данные ----------

              private fun tabIcon(i: Int): String = if (i == 0) "🕘" else Emojis.cats[i - 1].icon

              private fun catList(i: Int): List<String> = if (i == 0) recentShown else Emojis.cats[i - 1].items

              private fun maxScroll(): Float {
                  if (width == 0) return 0f
                  val list = catList(emojiCat)
                  val cw = width / emojiCols.toFloat()
                  val rowsN = (list.size + emojiCols - 1) / emojiCols
                  return maxOf(0f, rowsN * cw - (gridBottom - gridTop))
              }

              private fun emojiAt(x: Float, y: Float): String? {
                  if (y < gridTop || y > gridBottom || width == 0) return null
                  val cw = width / emojiCols.toFloat()
                  val col = (x / cw).toInt()
                  if (col < 0 || col >= emojiCols) return null
                  val row = ((y - gridTop + emojiScroll) / cw).toInt()
                  return catList(emojiCat).getOrNull(row * emojiCols + col)
              }

              private fun pickEmoji(em: String) {
                  playSound(0)
                  haptic()
                  listener?.onText(em)
                  recent.remove(em)
                  recent.add(0, em)
                  while (recent.size > 32) recent.removeAt(recent.size - 1)
                  prefs.recentEmoji = recent.joinToString(" ")
              }

              // ---------- касания ----------

              private fun keyAt(x: Float, y: Float): Key? {
                  for (row in rows) for (k in row) {
                      if (k.type == T.GAP) continue
                      if (x >= k.r.left - hGap / 2 && x <= k.r.right + hGap / 2 &&
                          y >= k.r.top - vGap / 2 && y <= k.r.bottom + vGap / 2
                      ) return k
                  }
                  return null
              }

              private fun playSound(kind: Int) {
                  if (prefs.soundOn) sound.play(prefs.soundStyle, kind, prefs.volume / 100f)
              }

              private fun haptic() {
                  if (prefs.haptic) {
                      @Suppress("DEPRECATION")
                      performHapticFeedback(
                          HapticFeedbackConstants.KEYBOARD_TAP,
                          HapticFeedbackConstants.FLAG_IGNORE_GLOBAL_SETTING
                      )
                  }
              }

              private fun feedback(k: Key) {
                  playSound(
                      when (k.type) {
                          T.CHAR -> 0
                          T.DEL -> 1
                          else -> 2
                      }
                  )
                  haptic()
              }

              override fun onTouchEvent(e: MotionEvent): Boolean {
                  if (e.actionMasked == MotionEvent.ACTION_DOWN) {
                      parent?.requestDisallowInterceptTouchEvent(true)
                      gesture = when {
                          e.y < topPad - 6 * d -> if (page == 3) G_TABS else G_BAR
                          page == 3 && e.y < gridBottom -> G_GRID
                          else -> G_KEYS
                      }
                  }
                  val r = when (gesture) {
                      G_BAR -> barTouch(e)
                      G_TABS -> tabsTouch(e)
                      G_GRID -> gridTouch(e)
                      else -> keysTouch(e)
                  }
                  invalidate()
                  return r
              }

              private fun slotAt(x: Float): Int = (x / (width / 3f)).toInt().coerceIn(0, 2)

              private fun barTouch(e: MotionEvent): Boolean {
                  when (e.actionMasked) {
                      MotionEvent.ACTION_DOWN -> {
                          val s = slotAt(e.x)
                          barSlot = if (s < suggestions.size) s else -1
                      }
                      MotionEvent.ACTION_MOVE -> {
                          if (barSlot >= 0 && slotAt(e.x) != barSlot) barSlot = -1
                      }
                      MotionEvent.ACTION_UP -> {
                          val s = barSlot
                          barSlot = -1
                          if (s >= 0 && s < suggestions.size && slotAt(e.x) == s) {
                              val w = suggestions[s]
                              playSound(2)
                              haptic()
                              listener?.onSuggest(w)
                          }
                      }
                      MotionEvent.ACTION_CANCEL -> barSlot = -1
                  }
                  return true
              }

              private fun tabAt(x: Float): Int {
                  val n = Emojis.cats.size + 1
                  return (x / (width / n.toFloat())).toInt().coerceIn(0, n - 1)
              }

              private fun refreshRecentShown() {
                  recentShown = recent.toList()
              }

              private fun tabsTouch(e: MotionEvent): Boolean {
                  when (e.actionMasked) {
                      MotionEvent.ACTION_DOWN -> tabDown = tabAt(e.x)
                      MotionEvent.ACTION_UP -> {
                          if (tabDown >= 0 && tabAt(e.x) == tabDown) {
                              emojiCat = tabDown
                              if (emojiCat == 0) refreshRecentShown()
                              emojiScroll = 0f
                              scroller.abortAnimation()
                              playSound(2)
                              haptic()
                          }
                          tabDown = -1
                      }
                      MotionEvent.ACTION_CANCEL -> tabDown = -1
                  }
                  return true
              }

              private fun gridTouch(e: MotionEvent): Boolean {
                  when (e.actionMasked) {
                      MotionEvent.ACTION_DOWN -> {
                          scroller.abortAnimation()
                          removeCallbacks(flingRun)
                          downX = e.x
                          downY = e.y
                          downScroll = emojiScroll
                          dragging = false
                          velocity?.recycle()
                          velocity = VelocityTracker.obtain()
                          velocity?.addMovement(e)
                      }
                      MotionEvent.ACTION_MOVE -> {
                          velocity?.addMovement(e)
                          val dy = e.y - downY
                          if (!dragging && abs(dy) > slop) dragging = true
                          if (dragging) emojiScroll = (downScroll - dy).coerceIn(0f, maxScroll())
                      }
                      MotionEvent.ACTION_UP -> {
                          velocity?.addMovement(e)
                          if (dragging) {
                              velocity?.computeCurrentVelocity(1000)
                              val vy = velocity?.yVelocity ?: 0f
                              scroller.fling(0, emojiScroll.toInt(), 0, (-vy).toInt(), 0, 0, 0, maxScroll().toInt())
                              postOnAnimation(flingRun)
                          } else {
                              val em = emojiAt(e.x, e.y)
                              if (em != null) pickEmoji(em)
                          }
                          velocity?.recycle()
                          velocity = null
                      }
                      MotionEvent.ACTION_CANCEL -> {
                          velocity?.recycle()
                          velocity = null
                      }
                  }
                  return true
              }

              private fun keysTouch(e: MotionEvent): Boolean {
                  when (e.actionMasked) {
                      MotionEvent.ACTION_DOWN, MotionEvent.ACTION_POINTER_DOWN -> {
                          val i = e.actionIndex
                          val k = keyAt(e.getX(i), e.getY(i))
                          if (k != null) {
                              active[e.getPointerId(i)] = k
                              press(k)
                          }
                      }
                      MotionEvent.ACTION_MOVE -> {
                          for (i in 0 until e.pointerCount) {
                              val id = e.getPointerId(i)
                              val cur = active[id] ?: continue
                              if (cur.type != T.CHAR) continue
                              val k = keyAt(e.getX(i), e.getY(i))
                              if (k != null && k !== cur && k.type == T.CHAR) {
                                  if (altKey === cur) cancelAlt()
                                  active[id] = k
                                  feedback(k)
                              }
                          }
                      }
                      MotionEvent.ACTION_UP, MotionEvent.ACTION_POINTER_UP -> {
                          val id = e.getPointerId(e.actionIndex)
                          active.remove(id)?.let { release(it) }
                      }
                      MotionEvent.ACTION_CANCEL -> {
                          active.clear()
                          cancelAlt()
                          handler.removeCallbacks(repeat)
                          handler.removeCallbacks(langRun)
                      }
                  }
                  return true
              }

              private fun cancelAlt() {
                  handler.removeCallbacks(altRun)
                  altKey = null
                  altOn = false
              }

              private fun press(k: Key) {
                  feedback(k)
                  when (k.type) {
                      T.CHAR -> {
                          if (page == 0 && lang == 1 && ALTS.containsKey(k.label)) {
                              altKey = k
                              altOn = false
                              handler.postDelayed(altRun, 380)
                          }
                      }
                      T.DEL -> {
                          listener?.onDelete()
                          handler.postDelayed(repeat, 380)
                      }
                      T.LANG -> {
                          langLong = false
                          handler.postDelayed(langRun, 450)
                      }
                      else -> {}
                  }
              }

              private fun release(k: Key) {
                  when (k.type) {
                      T.CHAR -> {
                          var s = if (page == 0 && shift > 0) k.label.uppercase() else k.label
                          if (altOn && altKey === k) {
                              val a = ALTS[k.label]
                              if (a != null) s = if (page == 0 && shift > 0) a.uppercase() else a
                          }
                          if (altKey === k) cancelAlt()
                          if (shift == 1) shift = 0
                          listener?.onText(s)
                      }
                      T.SPACE -> listener?.onText(" ")
                      T.ENTER -> listener?.onEnter()
                      T.SHIFT -> {
                          val now = SystemClock.uptimeMillis()
                          shift = when {
                              shift == 2 -> 0
                              shift == 1 && now - lastShiftTap < 400 -> 2
                              shift == 1 -> 0
                              else -> 1
                          }
                          lastShiftTap = now
                      }
                      T.DEL -> handler.removeCallbacks(repeat)
                      T.MODE -> page = if (page == 0) 1 else 0
                      T.SYM -> page = if (page == 1) 2 else 1
                      T.EMOJI -> {
                          emojiCat = if (recent.isEmpty()) 1 else 0
                          emojiScroll = 0f
                          refreshRecentShown()
                          page = 3
                      }
                      T.LANG -> {
                          handler.removeCallbacks(langRun)
                          if (!langLong) {
                              lang = 1 - lang
                              prefs.lang = lang
                              build()
                          }
                      }
                      T.GAP -> {}
                  }
              }

              companion object {
                  // долгое нажатие на букву даёт другую (русская раскладка)
                  private val ALTS = mapOf("е" to "ё")
                  private const val G_KEYS = 0
                  private const val G_BAR = 1
                  private const val G_TABS = 2
                  private const val G_GRID = 3
              }
          }
