          package com.iphonekb

          import android.Manifest
          import android.app.Activity
          import android.content.pm.PackageManager
          import android.os.Bundle
          import android.widget.Toast

          /** Прозрачная активность: клавиатура сама не может показать запрос разрешения, поэтому просим микрофон отсюда. */
          class MicPermissionActivity : Activity() {

              private var startVoice = false

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  startVoice = intent.getBooleanExtra("start", false)
                  if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) == PackageManager.PERMISSION_GRANTED) {
                      Toast.makeText(this, "Микрофон уже разрешён", Toast.LENGTH_SHORT).show()
                      done(true)
                  } else {
                      requestPermissions(arrayOf(Manifest.permission.RECORD_AUDIO), 77)
                  }
              }

              override fun onRequestPermissionsResult(code: Int, perms: Array<out String>, res: IntArray) {
                  super.onRequestPermissionsResult(code, perms, res)
                  val ok = res.isNotEmpty() && res[0] == PackageManager.PERMISSION_GRANTED
                  if (!ok) {
                      Toast.makeText(this, "Микрофон запрещён. Разреши его в настройках приложения.", Toast.LENGTH_LONG).show()
                  }
                  done(ok)
              }

              private fun done(ok: Boolean) {
                  if (ok && startVoice) KeyboardService.instance?.voiceAfterPermission()
                  finish()
              }
          }
