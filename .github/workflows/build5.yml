                  fun dp(x: Int) = (x * d).toInt()

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(16), dp(24), dp(16), dp(24))
                  }

                  fun label(t: String, size: Float = 16f, bold: Boolean = false) = TextView(this).apply {
                      text = t
                      textSize = size
                      if (bold) setTypeface(null, Typeface.BOLD)
                      setPadding(0, dp(14), 0, dp(6))
                  }

                  fun button(t: String, f: () -> Unit) = Button(this).apply {
                      text = t
                      isAllCaps = false
                      setOnClickListener { f() }
                  }

                  val kv = KeyboardView(this)
                  val edit = EditText(this).apply {
                      hint = "Проверь клавиатуру здесь"
                      showSoftInputOnFocus = false
                  }

                  fun cursor(): Int = edit.selectionStart.coerceAtLeast(0)

                  fun refreshPreview() {
                      if (!p.suggest) {
                          kv.suggestions = emptyList()
                          return
                      }
                      val pre = Dictionary.prefixOf(edit.text.subSequence(0, cursor()))
                      kv.suggestions = if (pre.isEmpty()) emptyList() else dict.suggest(pre, 3)
                  }

                  kv.listener = object : KeyboardView.Listener {
                      override fun onText(t: String) {
                          edit.text.insert(cursor(), t)
                          refreshPreview()
                      }

                      override fun onDelete() {
                          val s = edit.selectionStart
                          if (s > 0) edit.text.delete(s - 1, s)
                          refreshPreview()
                      }

                      override fun onEnter() {
                          edit.text.insert(cursor(), "\n")
                          refreshPreview()
                      }

                      override fun onSwitchIme() {
                          (getSystemService(INPUT_METHOD_SERVICE) as InputMethodManager).showInputMethodPicker()
                      }

                      override fun onSuggest(w: String) {
                          val pos = cursor()
                          val pre = Dictionary.prefixOf(edit.text.subSequence(0, pos))
                          val ins = if (p.autoSpace) "$w " else w
                          edit.text.replace(pos - pre.length, pos, ins)
                          edit.setSelection(pos - pre.length + ins.length)
                          refreshPreview()
                      }
