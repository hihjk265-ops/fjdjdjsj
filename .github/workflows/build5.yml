name: Build APK v5

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Create project files
        run: |
          set -e
          mkdir -p proj
          cd proj
          cat > settings.gradle.kts <<'KBEOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "IPhoneKeyboard"
          include(":app")
          KBEOF
          cat > build.gradle.kts <<'KBEOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          KBEOF
          cat > gradle.properties <<'KBEOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          KBEOF
          mkdir -p app
          cat > app/build.gradle.kts <<'KBEOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.iphonekb"
              compileSdk = 34

              // Постоянный ключ подписи: новые сборки ставятся поверх старых без удаления
              signingConfigs {
                  getByName("debug") {
                      storeFile = file("debug.keystore")
                      storePassword = "android"
                      keyAlias = "androiddebugkey"
                      keyPassword = "android"
                  }
              }

              defaultConfig {
                  applicationId = "com.iphonekb"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 7
                  versionName = "1.6"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          KBEOF
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'KBEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />

              <queries>
                  <intent>
                      <action android:name="android.speech.RecognitionService" />
                  </intent>
              </queries>

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:theme="@android:style/Theme.Material.Light">

                  <activity
                      android:name=".SettingsActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <activity
                      android:name=".MicPermissionActivity"
                      android:exported="false"
                      android:excludeFromRecents="true"
                      android:taskAffinity=""
                      android:theme="@android:style/Theme.Translucent.NoTitleBar" />

                  <service
                      android:name=".KeyboardService"
                      android:exported="true"
                      android:label="@string/ime_name"
                      android:permission="android.permission.BIND_INPUT_METHOD">
                      <intent-filter>
                          <action android:name="android.view.InputMethod" />
                      </intent-filter>
                      <meta-data
                          android:name="android.view.im"
                          android:resource="@xml/method" />
                  </service>
              </application>
          </manifest>
          KBEOF
          mkdir -p app/src/main/res/xml
          cat > app/src/main/res/xml/method.xml <<'KBEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <input-method xmlns:android="http://schemas.android.com/apk/res/android"
              android:settingsActivity="com.iphonekb.SettingsActivity" />
          KBEOF
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/strings.xml <<'KBEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">iPhone Keyboard</string>
              <string name="ime_name">iPhone Keyboard</string>
          </resources>
          KBEOF
          cat > app/src/main/res/values/colors.xml <<'KBEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_bg">#2F6BFF</color>
          </resources>
          KBEOF
          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/ic_fg.xml <<'KBEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#FFFFFFFF"
                  android:pathData="M29.60,33.00 h5.30 a2.60,2.60 0 0 1 2.60,2.60 v5.80 a2.60,2.60 0 0 1 -2.60,2.60 h-5.30 a2.60,2.60 0 0 1 -2.60,-2.60 v-5.80 a2.60,2.60 0 0 1 2.60,-2.60 z M44.10,33.00 h5.30 a2.60,2.60 0 0 1 2.60,2.60 v5.80 a2.60,2.60 0 0 1 -2.60,2.60 h-5.30 a2.60,2.60 0 0 1 -2.60,-2.60 v-5.80 a2.60,2.60 0 0 1 2.60,-2.60 z M58.60,33.00 h5.30 a2.60,2.60 0 0 1 2.60,2.60 v5.80 a2.60,2.60 0 0 1 -2.60,2.60 h-5.30 a2.60,2.60 0 0 1 -2.60,-2.60 v-5.80 a2.60,2.60 0 0 1 2.60,-2.60 z M73.10,33.00 h5.30 a2.60,2.60 0 0 1 2.60,2.60 v5.80 a2.60,2.60 0 0 1 -2.60,2.60 h-5.30 a2.60,2.60 0 0 1 -2.60,-2.60 v-5.80 a2.60,2.60 0 0 1 2.60,-2.60 z M36.85,48.00 h5.30 a2.60,2.60 0 0 1 2.60,2.60 v5.80 a2.60,2.60 0 0 1 -2.60,2.60 h-5.30 a2.60,2.60 0 0 1 -2.60,-2.60 v-5.80 a2.60,2.60 0 0 1 2.60,-2.60 z M51.35,48.00 h5.30 a2.60,2.60 0 0 1 2.60,2.60 v5.80 a2.60,2.60 0 0 1 -2.60,2.60 h-5.30 a2.60,2.60 0 0 1 -2.60,-2.60 v-5.80 a2.60,2.60 0 0 1 2.60,-2.60 z M65.85,48.00 h5.30 a2.60,2.60 0 0 1 2.60,2.60 v5.80 a2.60,2.60 0 0 1 -2.60,2.60 h-5.30 a2.60,2.60 0 0 1 -2.60,-2.60 v-5.80 a2.60,2.60 0 0 1 2.60,-2.60 z M40.48,63.00 h27.05 a2.60,2.60 0 0 1 2.60,2.60 v5.80 a2.60,2.60 0 0 1 -2.60,2.60 h-27.05 a2.60,2.60 0 0 1 -2.60,-2.60 v-5.80 a2.60,2.60 0 0 1 2.60,-2.60 z" />
          </vector>
          KBEOF
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'KBEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_bg" />
              <foreground android:drawable="@drawable/ic_fg" />
              <monochrome android:drawable="@drawable/ic_fg" />
          </adaptive-icon>
