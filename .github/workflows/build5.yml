          package com.iphonekb

          import android.content.Context
          import android.os.Build
          import android.os.VibrationEffect
          import android.os.Vibrator
          import android.os.VibratorManager

          /** Вибрация нажатий с настраиваемой силой (1..100). */
          object Haptics {
              @Volatile
              private var vib: Vibrator? = null

              @Suppress("DEPRECATION")
              private fun get(ctx: Context): Vibrator? {
                  vib?.let { return it }
                  val app = ctx.applicationContext
                  val v = if (Build.VERSION.SDK_INT >= 31) {
                      app.getSystemService(VibratorManager::class.java)?.defaultVibrator
                  } else {
                      app.getSystemService(Context.VIBRATOR_SERVICE) as? Vibrator
                  }
                  vib = v
                  return v
              }

              @Suppress("DEPRECATION")
              fun tick(ctx: Context, strength: Int) {
                  val v = get(ctx) ?: return
                  if (!v.hasVibrator()) return
                  val s = strength.coerceIn(1, 100)
                  val ms = (6 + s * 34 / 100).toLong()
                  try {
                      if (Build.VERSION.SDK_INT >= 26) {
                          val amp = if (v.hasAmplitudeControl()) (s * 255 / 100).coerceAtLeast(1)
                          else VibrationEffect.DEFAULT_AMPLITUDE
                          v.vibrate(VibrationEffect.createOneShot(ms, amp))
                      } else {
                          v.vibrate(ms)
                      }
                  } catch (e: Exception) {
                  }
              }
          }
