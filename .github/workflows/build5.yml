                              isChecked = p.showClip
                              setOnCheckedChangeListener { _, v ->
                                  p.showClip = v
                                  kv.refresh()
                              }
                          })

                          // Голос и буфер обмена
                          root.addView(label("Голос и буфер обмена", 18f, true))
