          cat > app/src/main/java/com/iphonekb/Prefs.kt <<'KBEOF'
          package com.iphonekb

          import android.content.Context
          import org.json.JSONArray

          class Prefs(ctx: Context) {
              private val sp = ctx.applicationContext.getSharedPreferences("kb", Context.MODE_PRIVATE)

              var theme: Int
                  get() = sp.getInt("theme", 0).coerceIn(0, Themes.all.size - 1)
                  set(v) = sp.edit().putInt("theme", v).apply()

              var soundOn: Boolean
                  get() = sp.getBoolean("soundOn", true)
                  set(v) = sp.edit().putBoolean("soundOn", v).apply()

              var soundStyle: Int
                  get() = sp.getInt("soundStyle", 0).coerceIn(0, SoundEngine.STYLES.size - 1)
                  set(v) = sp.edit().putInt("soundStyle", v).apply()

              var volume: Int
                  get() = sp.getInt("volume", 70)
                  set(v) = sp.edit().putInt("volume", v).apply()

              var haptic: Boolean
                  get() = sp.getBoolean("haptic", true)
                  set(v) = sp.edit().putBoolean("haptic", v).apply()

              var vibStrength: Int
                  get() = sp.getInt("vibStrength", 50).coerceIn(1, 100)
                  set(v) = sp.edit().putInt("vibStrength", v.coerceIn(1, 100)).apply()

              var vibMode: Int // 0 = системная, 1 = своя
                  get() = sp.getInt("vibMode", 0).coerceIn(0, 1)
                  set(v) = sp.edit().putInt("vibMode", v).apply()

              var keyHeight: Int // dp
                  get() = sp.getInt("keyHeight", 47).coerceIn(40, 60)
                  set(v) = sp.edit().putInt("keyHeight", v.coerceIn(40, 60)).apply()

              var showMic: Boolean
                  get() = sp.getBoolean("showMic", true)
                  set(v) = sp.edit().putBoolean("showMic", v).apply()

              var showEmoji: Boolean
                  get() = sp.getBoolean("showEmoji", true)
                  set(v) = sp.edit().putBoolean("showEmoji", v).apply()

              var showClip: Boolean
                  get() = sp.getBoolean("showClip", true)
                  set(v) = sp.edit().putBoolean("showClip", v).apply()

              var popup: Boolean
                  get() = sp.getBoolean("popup", true)
                  set(v) = sp.edit().putBoolean("popup", v).apply()

              var lang: Int
                  get() = sp.getInt("lang", 0)
                  set(v) = sp.edit().putInt("lang", v).apply()

              // ---- подсказки слов ----

              var suggest: Boolean
                  get() = sp.getBoolean("suggest", true)
                  set(v) = sp.edit().putBoolean("suggest", v).apply()

              var learn: Boolean
                  get() = sp.getBoolean("learn", true)
                  set(v) = sp.edit().putBoolean("learn", v).apply()

              var autoSpace: Boolean
                  get() = sp.getBoolean("autoSpace", true)
                  set(v) = sp.edit().putBoolean("autoSpace", v).apply()

              var autoCap: Boolean
                  get() = sp.getBoolean("autoCap", false)
                  set(v) = sp.edit().putBoolean("autoCap", v).apply()

              // ---- буфер обмена ----

              var clipOn: Boolean
                  get() = sp.getBoolean("clipOn", true)
                  set(v) = sp.edit().putBoolean("clipOn", v).apply()

              var clips: List<String>
                  get() = try {
                      val a = JSONArray(sp.getString("clips", "[]") ?: "[]")
                      List(a.length()) { a.getString(it) }
                  } catch (e: Exception) {
                      emptyList()
                  }
                  set(v) = sp.edit().putString("clips", JSONArray(v).toString()).apply()

              // ---- смайлики ----

              var recentEmoji: String
                  get() = sp.getString("recentEmoji", "") ?: ""
                  set(v) = sp.edit().putString("recentEmoji", v).apply()
          }
