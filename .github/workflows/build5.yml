          package com.iphonekb

          import android.Manifest
          import android.content.ClipboardManager
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.graphics.Color
          import android.os.Bundle
          import android.os.Handler
          import android.speech.RecognitionListener
          import android.speech.RecognizerIntent
          import android.speech.SpeechRecognizer
          import android.widget.Toast
          import android.inputmethodservice.InputMethodService
          import android.os.Build
          import android.text.InputType
          import android.view.KeyEvent
          import android.view.View
          import android.view.WindowInsetsController
          import android.view.WindowManager
          import android.view.inputmethod.EditorInfo
          import android.view.inputmethod.InputMethodManager

          class KeyboardService : InputMethodService() {

              private lateinit var view: KeyboardView
              private lateinit var prefs: Prefs
              private lateinit var dict: Dictionary
              private var info: EditorInfo? = null
              private var suggestOn = false
              private var learnOn = false
              private lateinit var cm: ClipboardManager
              private val clipListener = ClipboardManager.OnPrimaryClipChangedListener { captureClip() }
              private var recognizer: SpeechRecognizer? = null
              private var listening = false
              private var pendingVoice = false

              override fun onCreate() {
                  super.onCreate()
                  prefs = Prefs(this)
                  dict = Dictionary.get(this)
                  instance = this
                  cm = getSystemService(CLIPBOARD_SERVICE) as ClipboardManager
                  cm.addPrimaryClipChangedListener(clipListener)
              }

              override fun onCreateInputView(): View {
                  view = KeyboardView(this)
                  view.listener = object : KeyboardView.Listener {
                      override fun onText(t: String) {
                          val ic = currentInputConnection ?: return
                          val first = t.firstOrNull()
                          if (first != null && !(first.isLetter() || first == '\'')) learnCurrent()
                          ic.commitText(t, 1)
                          updateCaps()
                          refreshSuggestions()
                      }

                      override fun onDelete() {
                          val ic = currentInputConnection ?: return
                          val sel = ic.getSelectedText(0)
                          if (!sel.isNullOrEmpty()) ic.commitText("", 1)
                          else ic.deleteSurroundingTextInCodePoints(1, 0)
                          updateCaps()
                          refreshSuggestions()
                      }

                      override fun onEnter() {
                          val ic = currentInputConnection ?: return
                          learnCurrent()
                          val ei = info
                          val opts = ei?.imeOptions ?: 0
                          val action = opts and EditorInfo.IME_MASK_ACTION
                          val noAction = (opts and EditorInfo.IME_FLAG_NO_ENTER_ACTION) != 0
                          if (!noAction && action != EditorInfo.IME_ACTION_NONE &&
                              action != EditorInfo.IME_ACTION_UNSPECIFIED
                          ) {
                              ic.performEditorAction(action)
                          } else {
                              ic.sendKeyEvent(KeyEvent(KeyEvent.ACTION_DOWN, KeyEvent.KEYCODE_ENTER))
                              ic.sendKeyEvent(KeyEvent(KeyEvent.ACTION_UP, KeyEvent.KEYCODE_ENTER))
                          }
                          updateCaps()
                          refreshSuggestions()
                      }

                      override fun onSwitchIme() {
                          (getSystemService(INPUT_METHOD_SERVICE) as InputMethodManager).showInputMethodPicker()
                      }

                      override fun onMic() {
                                  toggleVoice()
                              }

                              override fun onSuggest(w: String) {
                          val ic = currentInputConnection ?: return
                          val prefix = wordBeforeCursor()
                          ic.beginBatchEdit()
                          ic.deleteSurroundingText(prefix.length, 0)
                          ic.commitText(if (prefs.autoSpace) "$w " else w, 1)
                          ic.endBatchEdit()
                          if (learnOn) dict.learn(w)
                          updateCaps()
                          refreshSuggestions()
                      }
                  }
                  return view
              }

              override fun onEvaluateFullscreenMode(): Boolean = false

              override fun onStartInputView(attribute: EditorInfo, restarting: Boolean) {
                  super.onStartInputView(attribute, restarting)
                  info = attribute
                  val sensitive = isSensitive(attribute)
                  suggestOn = prefs.suggest && !sensitive
                  learnOn = prefs.learn && !sensitive
                  view.refresh()
                  view.configure(attribute.inputType)
                  view.enterKind = kindFor(attribute)
                  view.suggestions = emptyList()
                  applyNavBar(Themes.all[prefs.theme])
                  captureClip()
                  if (pendingVoice) {
                      pendingVoice = false
                      view.post { startVoice() }
                  }
                  if (!prefs.autoCap) view.autoShift(false)
                  updateCaps()
                  refreshSuggestions()
              }

              /** Нижняя системная панель (треугольник, круг, квадрат или полоска жестов) в цвет клавиатуры. */
              @Suppress("DEPRECATION")
              private fun applyNavBar(t: Theme) {
                  val w = window?.window ?: return
                  w.addFlags(WindowManager.LayoutParams.FLAG_DRAWS_SYSTEM_BAR_BACKGROUNDS)
                  w.navigationBarColor = t.bg
                  val light = Color.luminance(t.bg) > 0.5f
                  if (Build.VERSION.SDK_INT >= 30) {
                      val ic = w.insetsController
                      if (ic != null) {
                          ic.setSystemBarsAppearance(
                              if (light) WindowInsetsController.APPEARANCE_LIGHT_NAVIGATION_BARS else 0,
                              WindowInsetsController.APPEARANCE_LIGHT_NAVIGATION_BARS
                          )
                      }
                  } else if (Build.VERSION.SDK_INT >= 26) {
                      val dv = w.decorView
                      val f = dv.systemUiVisibility
                      dv.systemUiVisibility = if (light) {
                          f or View.SYSTEM_UI_FLAG_LIGHT_NAVIGATION_BAR
                      } else {
                          f and View.SYSTEM_UI_FLAG_LIGHT_NAVIGATION_BAR.inv()
                      }
                  }
              }

              /** Пароли, почта, ссылки, числа и поля «без подсказок»: ничего не предлагаем и не запоминаем. */
              private fun isSensitive(ei: EditorInfo): Boolean {
                  val t = ei.inputType
                  if ((t and InputType.TYPE_MASK_CLASS) != InputType.TYPE_CLASS_TEXT) return true
                  val v = t and InputType.TYPE_MASK_VARIATION
                  return v == InputType.TYPE_TEXT_VARIATION_PASSWORD ||
                      v == InputType.TYPE_TEXT_VARIATION_VISIBLE_PASSWORD ||
                      v == InputType.TYPE_TEXT_VARIATION_WEB_PASSWORD ||
                      v == InputType.TYPE_TEXT_VARIATION_EMAIL_ADDRESS ||
                      v == InputType.TYPE_TEXT_VARIATION_WEB_EMAIL_ADDRESS ||
                      v == InputType.TYPE_TEXT_VARIATION_URI ||
                      (t and InputType.TYPE_TEXT_FLAG_NO_SUGGESTIONS) != 0
              }

              private fun wordBeforeCursor(): String {
                  val ic = currentInputConnection ?: return ""
                  val before = ic.getTextBeforeCursor(40, 0) ?: return ""
                  return Dictionary.prefixOf(before)
              }

              private fun refreshSuggestions() {
                  if (!suggestOn) {
                      view.suggestions = emptyList()
                      return
                  }
                  val w = wordBeforeCursor()
                  view.suggestions = if (w.isEmpty()) emptyList() else dict.suggest(w, 3)
              }

              private fun learnCurrent() {
                  if (!learnOn) return
                  val w = wordBeforeCursor()
                  if (w.length >= 2) dict.learn(w)
              }

              /** 0 = return/ввод, 1 = go, 2 = search/поиск, 3 = send, 4 = next, 5 = done. Подпись зависит от языка раскладки. */
              private fun kindFor(ei: EditorInfo): Int {
                  val opts = ei.imeOptions
                  if ((opts and EditorInfo.IME_FLAG_NO_ENTER_ACTION) != 0) return 0
                  return when (opts and EditorInfo.IME_MASK_ACTION) {
                      EditorInfo.IME_ACTION_GO -> 1
                      EditorInfo.IME_ACTION_SEARCH -> 2
                      EditorInfo.IME_ACTION_SEND -> 3
                      EditorInfo.IME_ACTION_NEXT -> 4
                      EditorInfo.IME_ACTION_DONE -> 5
                      else -> 0
                  }
              }

              // ---------- буфер обмена ----------

              private fun captureClip() {
                  if (!prefs.clipOn) return
                  try {
                      val clip = cm.primaryClip ?: return
                      if (clip.itemCount == 0) return
                      if (Build.VERSION.SDK_INT >= 28 &&
                          clip.description?.extras?.getBoolean("android.content.extra.IS_SENSITIVE", false) == true
                      ) return
                      val t = clip.getItemAt(0).coerceToText(this)?.toString()?.trim() ?: return
                      if (t.isEmpty() || t.length > 3000) return
                      val list = prefs.clips.toMutableList()
                      if (list.firstOrNull() == t) return
                      list.remove(t)
                      list.add(0, t)
                      while (list.size > 30) list.removeAt(list.size - 1)
                      prefs.clips = list
                  } catch (e: Exception) {
                  }
              }

              // ---------- голосовой ввод ----------

              private fun toast(s: String) = Toast.makeText(this, s, Toast.LENGTH_SHORT).show()

              fun toggleVoice() {
                  if (listening) recognizer?.stopListening() else startVoice()
              }

              /** Вызывается после выдачи разрешения на микрофон. */
              fun voiceAfterPermission() {
                  pendingVoice = true
                  Handler(mainLooper).postDelayed({
                      if (pendingVoice) {
                          pendingVoice = false
                          startVoice()
                      }
                  }, 700)
              }

              fun startVoice() {
                  if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      val i = Intent(this, MicPermissionActivity::class.java)
                      i.putExtra("start", true)
                      i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                      startActivity(i)
                      return
                  }
                  if (!SpeechRecognizer.isRecognitionAvailable(this)) {
                      toast("Распознавание речи недоступно на этом устройстве")
                      return
                  }
                  stopVoice()
                  val r = SpeechRecognizer.createSpeechRecognizer(this)
                  recognizer = r
                  r.setRecognitionListener(object : RecognitionListener {
                      override fun onReadyForSpeech(params: Bundle?) {}
                      override fun onBeginningOfSpeech() {}
                      override fun onRmsChanged(rmsdB: Float) {}
                      override fun onBufferReceived(buffer: ByteArray?) {}
                      override fun onEndOfSpeech() {}
                      override fun onPartialResults(partialResults: Bundle?) {}
                      override fun onEvent(eventType: Int, params: Bundle?) {}

                      override fun onError(error: Int) {
                          stopVoice()
                          if (error == SpeechRecognizer.ERROR_INSUFFICIENT_PERMISSIONS) {
                              toast("Нет разрешения на микрофон")
                          } else if (error != SpeechRecognizer.ERROR_NO_MATCH &&
                              error != SpeechRecognizer.ERROR_SPEECH_TIMEOUT
                          ) {
                              toast("Ошибка распознавания речи ($error)")
                          }
                      }

                      override fun onResults(results: Bundle?) {
                          val text = results?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)?.firstOrNull()
                          stopVoice()
                          if (text.isNullOrBlank()) return
                          val ic = currentInputConnection ?: return
                          val before = ic.getTextBeforeCursor(1, 0)
                          val lead = if (!before.isNullOrEmpty() && !before[0].isWhitespace()) " " else ""
                          ic.commitText(lead + text + " ", 1)
                          updateCaps()
                          refreshSuggestions()
                      }
                  })
                  val ri = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH)
                  ri.putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                  ri.putExtra(RecognizerIntent.EXTRA_LANGUAGE, if (prefs.lang == 1) "ru-RU" else "en-US")
                  ri.putExtra(RecognizerIntent.EXTRA_PARTIAL_RESULTS, false)
                  ri.putExtra(RecognizerIntent.EXTRA_CALLING_PACKAGE, packageName)
                  listening = true
                  if (::view.isInitialized) view.micOn = true
                  r.startListening(ri)
              }

              fun stopVoice() {
                  listening = false
                  if (::view.isInitialized) view.micOn = false
                  val r = recognizer
                  recognizer = null
                  if (r != null) {
                      Handler(mainLooper).post {
                          try {
                              r.destroy()
                          } catch (e: Exception) {
                          }
                      }
                  }
              }

              override fun onFinishInputView(finishingInput: Boolean) {
                  super.onFinishInputView(finishingInput)
                  stopVoice()
              }

              override fun onDestroy() {
                  stopVoice()
                  try {
                      cm.removePrimaryClipChangedListener(clipListener)
                  } catch (e: Exception) {
                  }
                  if (instance === this) instance = null
                  super.onDestroy()
              }

              companion object {
                  @Volatile
                  var instance: KeyboardService? = null
              }

              private fun updateCaps() {
                  if (!prefs.autoCap) return
                  val ei = info ?: return
                  val ic = currentInputConnection ?: return
                  if ((ei.inputType and InputType.TYPE_MASK_CLASS) != InputType.TYPE_CLASS_TEXT) return
                  view.autoShift(ic.getCursorCapsMode(ei.inputType) != 0)
              }
          }
